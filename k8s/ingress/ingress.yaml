# Ingress for toads.directory / auth.toads.directory
#
# Served by Traefik (see traefik-values.yaml) through its Kubernetes Ingress
# NGINX provider, which picks up ingressClassName "nginx" and the
# nginx.ingress.kubernetes.io/* annotations below. The "nginx" IngressClass
# object (controller k8s.io/ingress-nginx) must exist for this to be served.
#
# TLS: Cloudflare proxies both hosts and terminates public TLS. pids-tls-cert
# does not currently exist in the cluster, so Traefik serves its default
# self-signed cert to Cloudflare (requires Cloudflare SSL mode "Full", not
# "Full (strict)").

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pids-ingress
  namespace: pids-production
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Cloudflare proxy handles HTTPS - re-enable these if doing SSL in cluster
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - toads.directory
    - auth.toads.directory
    secretName: pids-tls-cert
    # keycloak-tls-cert
  rules:
  - host: toads.directory
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: auth.toads.directory
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
