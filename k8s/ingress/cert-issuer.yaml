# Certificate Issuer for Let's Encrypt SSL
#
# UNUSED: cert-manager is not installed in pids-production and nothing applies
# this file. Cloudflare terminates public TLS. Kept as a template in case
# in-cluster certificates are wanted later; requires cert-manager >= v1.12
# (for ingressClassName) and the Traefik ingress controller.

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # ACME server URL for Let's Encrypt production
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for Let's Encrypt notifications
    email: your-email@example.com  # CHANGE THIS
    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    # HTTP-01 challenge solver
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik

---
# Staging issuer for testing (optional)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # ACME server URL for Let's Encrypt staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: your-email@example.com  # CHANGE THIS
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik

